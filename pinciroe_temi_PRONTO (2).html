<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Pincirö – Proposte Tema Carnevale</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #39FF14;
    --green-dim: #2acc0e;
    --green-dark: #1a7a08;
    --black: #0a0a0a;
    --dark: #111111;
    --card: #191919;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #888;
    --radius: 12px;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'Nunito', sans-serif; background: var(--black); color: var(--text); min-height: 100vh; }

  header {
    background: var(--dark);
    border-bottom: 2px solid var(--green-dark);
    padding: 1.2rem 1rem 1rem;
    text-align: center;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 24px rgba(57,255,20,0.08);
  }
  header img { height: 54px; display: block; margin: 0 auto 0.3rem; }
  header p { font-size: 13px; color: var(--muted); letter-spacing: .04em; }

  .tabs {
    display: flex; background: var(--dark);
    border-bottom: 1px solid var(--border);
    padding: 0 1rem;
    position: sticky; top: 91px; z-index: 99;
  }
  .tab {
    flex: 1; padding: 13px 0; font-size: 14px; font-weight: 700;
    font-family: 'Nunito', sans-serif; background: none; color: var(--muted);
    border: none; border-bottom: 3px solid transparent; cursor: pointer;
    transition: color .2s, border-color .2s; letter-spacing: .03em;
  }
  .tab.active { color: var(--green); border-bottom-color: var(--green); }
  .tab:hover:not(.active) { color: var(--text); }

  main { max-width: 680px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  .section { display: none; }
  .section.visible { display: block; }

  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 11px; font-weight: 700; color: var(--green-dim); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 5px; }
  .field input, .field textarea, .field select {
    width: 100%; background: #1a1a1a; border: 1.5px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: 'Nunito', sans-serif;
    font-size: 15px; padding: 10px 12px; outline: none; transition: border-color .2s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--green-dim); }
  .field textarea { min-height: 90px; resize: vertical; }
  .field select option { background: #1a1a1a; }
  .char-count { font-size: 11px; color: var(--muted); text-align: right; margin-top: 3px; }

  .btn-submit {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 700;
    font-family: 'Nunito', sans-serif; background: var(--green); color: var(--black);
    border: none; border-radius: 10px; cursor: pointer; letter-spacing: .04em;
    transition: opacity .2s, transform .1s; margin-top: .5rem;
  }
  .btn-submit:hover { opacity: .88; }
  .btn-submit:active { transform: scale(.98); }
  .btn-submit:disabled { opacity: .5; cursor: not-allowed; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.2rem; gap: 10px; flex-wrap: wrap; }
  .sort-btn {
    padding: 6px 14px; font-size: 12px; font-weight: 700;
    font-family: 'Nunito', sans-serif; border: 1.5px solid var(--border);
    border-radius: 20px; background: #1a1a1a; color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .sort-btn.active { background: var(--green); color: var(--black); border-color: var(--green); }
  .sort-btn:hover:not(.active) { border-color: var(--green-dim); color: var(--text); }

  .proposal {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: .9rem; transition: border-color .2s;
  }
  .proposal:hover { border-color: #3a3a3a; }
  .prop-top { display: flex; gap: 12px; align-items: flex-start; }
  .prop-content { flex: 1; min-width: 0; }
  .prop-title { font-size: 16px; font-weight: 700; color: #fff; line-height: 1.3; }
  .prop-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .prop-meta strong { color: #bbb; }

  .vote-col { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
  .vote-btn {
    width: 36px; height: 36px; border: 1.5px solid var(--border); border-radius: 8px;
    background: #222; color: var(--muted); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
  }
  .vote-btn:hover { background: rgba(57,255,20,.12); color: var(--green); border-color: var(--green-dark); }
  .vote-btn.voted { background: rgba(57,255,20,.12); color: var(--green); border-color: var(--green-dark); cursor: default; }
  .vote-count { font-size: 16px; font-weight: 700; color: var(--text); }

  .prop-tags { display: flex; gap: 6px; flex-wrap: wrap; margin: .6rem 0; }
  .tag-cat { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: rgba(57,255,20,.1); color: var(--green); border: 1px solid var(--green-dark); }

  .prop-desc { font-size: 13px; color: #aaa; line-height: 1.65; margin-bottom: .5rem; }
  .prop-extra { font-size: 13px; color: #888; line-height: 1.6; border-left: 2px solid var(--green-dark); padding-left: 10px; margin-bottom: .6rem; font-style: italic; }

  .prop-footer { display: flex; justify-content: space-between; align-items: center; }
  .comment-toggle { font-size: 12px; font-weight: 700; color: var(--green-dim); background: none; border: none; cursor: pointer; font-family: 'Nunito', sans-serif; display: flex; align-items: center; gap: 5px; padding: 0; }
  .comment-toggle:hover { color: var(--green); }
  .delete-btn { font-size: 11px; color: #444; background: none; border: none; cursor: pointer; font-family: 'Nunito', sans-serif; padding: 0; }
  .delete-btn:hover { color: #c0392b; }

  .comments-area { margin-top: .8rem; border-top: 1px solid var(--border); padding-top: .8rem; display: none; }
  .comments-area.open { display: block; }
  .comment-item { display: flex; gap: 9px; margin-bottom: .6rem; }
  .comment-av { width: 28px; height: 28px; border-radius: 50%; background: rgba(57,255,20,.12); border: 1px solid var(--green-dark); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--green); flex-shrink: 0; margin-top: 1px; }
  .comment-body-inner { flex: 1; }
  .comment-meta-line { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .comment-meta-line strong { color: #bbb; }
  .comment-text { font-size: 13px; color: #bbb; line-height: 1.5; }
  .comment-form { display: flex; gap: 8px; margin-top: .7rem; flex-wrap: wrap; }
  .comment-form input { background: #1a1a1a; border: 1.5px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Nunito', sans-serif; font-size: 13px; padding: 7px 10px; outline: none; transition: border-color .2s; flex: 1; min-width: 80px; }
  .comment-form input:focus { border-color: var(--green-dim); }
  .comment-form input.inp-name { flex: 0 0 110px; }
  .comment-form button { padding: 7px 14px; font-size: 13px; font-weight: 700; font-family: 'Nunito', sans-serif; background: var(--green-dark); color: var(--green); border: 1px solid var(--green-dark); border-radius: 8px; cursor: pointer; transition: background .15s; white-space: nowrap; }
  .comment-form button:hover { background: var(--green); color: var(--black); }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 14px; line-height: 2; }
  .empty .ico { font-size: 40px; display: block; margin-bottom: .5rem; }
  .loading { text-align: center; padding: 2rem; color: var(--muted); font-size: 14px; }

  .config-alert { background: #1a1200; border: 1.5px solid #7a5a00; border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 1.5rem; font-size: 13px; line-height: 1.7; color: #e0c060; }
  .config-alert strong { color: #ffd700; }
  .config-alert code { background: #2a2000; border-radius: 4px; padding: 1px 5px; font-size: 12px; color: var(--green); }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--green); color: var(--black); padding: 9px 20px; border-radius: 8px; font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 9999; white-space: nowrap; }
  .toast.show { opacity: 1; }

  @media (max-width: 480px) {
    header img { height: 42px; }
    .tab { font-size: 13px; }
    .prop-title { font-size: 15px; }
    .comment-form input.inp-name { flex: 0 0 90px; }
  }
</style>
</head>

// ---- API helpers ----
async function sbFetch(path, opts = {}) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...opts.headers
    },
    method: opts.method || 'GET',
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  if (res.status === 204) return null;
  return res.json();
}

async function loadProposals() {
  try {
    const data = await sbFetch('proposals?select=*,comments(*)&order=votes.desc');
    proposals = data;
    render();
  } catch(e) {
    showAlert(e.message);
    document.getElementById('proposals-list').innerHTML = '';
  }
}

// ---- UI ----
function showTab(t) {
  document.getElementById('tab-list').classList.toggle('visible', t === 'list');
  document.getElementById('tab-new').classList.toggle('visible', t === 'new');
  document.querySelectorAll('.tab').forEach((el, i) => el.classList.toggle('active', (t==='list'&&i===0)||(t==='new'&&i===1)));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

function initials(n) {
  if (!n) return '?';
  const p = n.trim().split(' ');
  return p.length > 1 ? (p[0][0]+p[1][0]).toUpperCase() : n.substring(0,2).toUpperCase();
}

function timeAgo(ts) {
  if (!ts) return '';
  const d = Date.now() - new Date(ts).getTime();
  if (d < 60000) return 'adesso';
  if (d < 3600000) return Math.floor(d/60000) + ' min fa';
  if (d < 86400000) return Math.floor(d/3600000) + ' ore fa';
  return Math.floor(d/86400000) + ' giorni fa';
}

function hasVoted(id) { try { return !!localStorage.getItem('pv_'+id); } catch(e) { return false; } }
function setVoted(id) { try { localStorage.setItem('pv_'+id,'1'); } catch(e) {} }
function setSort(m) {
  sortMode = m;
  document.getElementById('sb-votes').classList.toggle('active', m==='votes');
  document.getElementById('sb-new').classList.toggle('active', m==='new');
  render();
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render() {
  const el = document.getElementById('proposals-list');
  if (!proposals.length) {
    el.innerHTML = '<div class="empty"><span class="ico">🎭</span>Ancora nessuna proposta.<br>Sii il primo a proporre un tema!</div>';
    return;
  }
  const sorted = [...proposals].sort((a,b) => sortMode==='votes' ? (b.votes||0)-(a.votes||0) : new Date(b.created_at)-new Date(a.created_at));
  el.innerHTML = sorted.map(p => {
    const voted = hasVoted(p.id);
    const cmts = p.comments || [];
    const isOpen = expanded[p.id];
    const isExpanded = expandedDetail[p.id];
    const photos = p.photos || [];

    // Parse motivazione and extra back out if stored together
    let motivazione = '', extraText = '';
    if (p.extra) {
      const motMatch = p.extra.match(/^💡 Motivazione: ([\s\S]*?)(\n\n|$)/);
      if (motMatch) {
        motivazione = motMatch[1].trim();
        extraText = p.extra.replace(/^💡 Motivazione: [\s\S]*?(\n\n|$)/, '').trim();
      } else {
        extraText = p.extra;
      }
    }

    const photosHtml = photos.length ? `
      <div style="margin:.8rem 0">
        <div style="font-size:11px;font-weight:700;color:var(--green-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">📷 Foto esempi</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${photos.map(url=>`<img src="${url}" style="width:100px;height:75px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer" onclick="window.open('${url}','_blank')">`).join('')}</div>
      </div>` : '';

    const detailHtml = isExpanded ? `
      <div style="margin:.6rem 0;border-top:1px solid var(--border);padding-top:.8rem;display:flex;flex-direction:column;gap:.8rem">
        ${motivazione ? `<div>
          <div style="font-size:11px;font-weight:700;color:var(--green-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">💡 Motivazione</div>
          <div style="font-size:13px;color:#ccc;line-height:1.65">${esc(motivazione)}</div>
        </div>` : ''}
        ${p.category ? `<div>
          <div style="font-size:11px;font-weight:700;color:var(--green-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">🎭 È satirico?</div>
          <div style="font-size:13px;color:#ccc;line-height:1.65">${esc(p.category)}</div>
        </div>` : ''}
        <div>
          <div style="font-size:11px;font-weight:700;color:var(--green-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">📋 Descrizione</div>
          <div style="font-size:13px;color:#ccc;line-height:1.65">${esc(p.description)}</div>
        </div>
        ${extraText ? `<div>
          <div style="font-size:11px;font-weight:700;color:var(--green-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">🔗 Riferimenti</div>
          <div style="font-size:13px;color:#ccc;line-height:1.65;word-break:break-word">${esc(extraText)}</div>
        </div>` : ''}
        ${photosHtml}
      </div>` : '';

    const commentsHtml = isOpen ? `
      <div class="comments-area open">
        ${cmts.length ? cmts.map(c => `
          <div class="comment-item">
            <div class="comment-av">${initials(c.author)}</div>
            <div class="comment-body-inner">
              <div class="comment-meta-line"><strong>${esc(c.author||'Anonimo')}</strong> · ${timeAgo(c.created_at)}</div>
              <div class="comment-text">${esc(c.body)}</div>
            </div>
          </div>`).join('') : '<div style="font-size:12px;color:#555;margin-bottom:.4rem">Nessun commento ancora.</div>'}
        <div class="comment-form">
          <input class="inp-name" type="text" id="cn-${p.id}" placeholder="Il tuo nome">
          <input type="text" id="ci-${p.id}" placeholder="Scrivi un commento..." onkeydown="if(event.key==='Enter') addComment(${p.id})">
          <button onclick="addComment(${p.id})">Invia</button>
        </div>
      </div>` : '';

    // Short preview of description
    const previewDesc = p.description && p.description.length > 100 ? p.description.substring(0,100)+'…' : p.description;

    return `<div class="proposal" id="prop-${p.id}">
      <div class="prop-top">
        <div class="prop-content">
          <div class="prop-title">${esc(p.title)}</div>
          <div class="prop-meta">di <strong>${esc(p.author||'Anonimo')}</strong> · ${timeAgo(p.created_at)}</div>
        </div>
        <div class="vote-col">
          <button class="vote-btn ${voted?'voted':''}" onclick="doVote(${p.id})" title="${voted?'Rimuovi voto':'Vota'}">▲</button>
          <span class="vote-count">${p.votes||0}</span>
        </div>
      </div>
      ${!isExpanded ? `<div class="prop-desc" style="margin-top:.5rem">${esc(previewDesc)}</div>` : ''}
      ${detailHtml}
      <div class="prop-footer" style="margin-top:.7rem">
        <div style="display:flex;gap:10px;align-items:center">
          <button class="comment-toggle" onclick="toggleDetail(${p.id})" style="color:var(--green)">
            ${isExpanded ? '▲ Chiudi' : '👁 Leggi tutto'}
          </button>
          <button class="comment-toggle" onclick="toggleComments(${p.id})">
            💬 ${cmts.length} ${cmts.length===1?'commento':'commenti'} ${isOpen?'▲':'▼'}
          </button>
        </div>
        <button class="delete-btn" onclick="deleteProposal(${p.id})">🗑 elimina</button>
      </div>
      ${commentsHtml}
    </div>`;
  }).join('');
}

// ---- Actions ----
window.doVote = async function(id) {
  const voted = hasVoted(id);
  try {
    if (voted) {
      await sbFetch('rpc/decrement_votes', { method:'POST', body:{ proposal_id: id }, prefer:'' });
      localStorage.removeItem('pv_'+id);
      const p = proposals.find(x=>x.id===id);
      if (p) p.votes = Math.max(0,(p.votes||0)-1);
    } else {
      await sbFetch('rpc/increment_votes', { method:'POST', body:{ proposal_id: id }, prefer:'' });
      localStorage.setItem('pv_'+id,'1');
      const p = proposals.find(x=>x.id===id);
      if (p) p.votes = (p.votes||0)+1;
    }
    render();
  } catch(e) { toast('Errore: '+e.message); }
};

// ---- Photo upload ----
let selectedFiles = [];

window.handleDrop = function(e) {
  e.preventDefault();
  document.getElementById('upload-zone').style.borderColor = 'var(--border)';
  previewPhotos(e.dataTransfer.files);
};

window.previewPhotos = function(files) {
  const arr = Array.from(files).slice(0, 3);
  selectedFiles = arr;
  const container = document.getElementById('photo-previews');
  container.innerHTML = arr.map((f, i) => {
    const url = URL.createObjectURL(f);
    return `<div style="position:relative">
      <img src="${url}" style="width:80px;height:65px;object-fit:cover;border-radius:6px;border:1px solid var(--green-dark)">
      <button onclick="removePhoto(${i})" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#c0392b;border:none;color:#fff;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0">✕</button>
    </div>`;
  }).join('');
};

window.removePhoto = function(i) {
  selectedFiles.splice(i, 1);
  previewPhotos(selectedFiles);
};

async function uploadPhotos(proposalId) {
  const urls = [];
  for (const file of selectedFiles) {
    const ext = file.name.split('.').pop();
    const path = `${proposalId}/${Date.now()}.${ext}`;
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/photos/${path}`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer '+SUPABASE_KEY, 'Content-Type': file.type },
      body: file
    });
    if (res.ok) {
      urls.push(`${SUPABASE_URL}/storage/v1/object/public/photos/${path}`);
    }
  }
  return urls;
}

window.toggleComments = function(id) {
  expanded[id] = !expanded[id];
  render();
};

window.toggleDetail = function(id) {
  expandedDetail[id] = !expandedDetail[id];
  render();
};

window.deleteProposal = async function(id) {
  const pwd = prompt('Inserisci la password per eliminare:');
  if (pwd === null) return;
  if (pwd !== 'Calcio1996.') { toast('❌ Password errata!'); return; }
  if (!confirm('Eliminare questa proposta?')) return;
  try {
    await sbFetch('proposals?id=eq.'+id, { method:'DELETE', prefer:'return=minimal' });
    proposals = proposals.filter(x=>x.id!==id);
    render(); toast('Proposta eliminata');
  } catch(e) { toast('Errore: '+e.message); }
};

window.addComment = async function(id) {
  const nameEl = document.getElementById('cn-'+id);
  const textEl = document.getElementById('ci-'+id);
  if (!textEl) return;
  const body = textEl.value.trim();
  const author = nameEl?.value.trim() || 'Anonimo';
  if (!body) { toast('Scrivi un commento!'); return; }
  try {
    const [c] = await sbFetch('comments', { method:'POST', body:{ proposal_id:id, author, body } });
    const p = proposals.find(x=>x.id===id);
    if (p) { if (!p.comments) p.comments=[]; p.comments.push(c); }
    render();
    setTimeout(()=>{ const ni=document.getElementById('ci-'+id); if(ni) ni.focus(); },60);
  } catch(e) { toast('Errore: '+e.message); }
};

window.submitProposal = async function() {
  const author = document.getElementById('f-name').value.trim() || 'Anonimo';
  const title = document.getElementById('f-title').value.trim();
  const motivazione = document.getElementById('f-motivazione').value.trim();
  const description = document.getElementById('f-desc').value.trim();
  const category = document.getElementById('f-cat').value.trim();
  const extra = document.getElementById('f-extra').value.trim();
  if (!title) { toast('Inserisci un titolo!'); return; }
  if (!description) { toast('Inserisci una descrizione!'); return; }
  const btn = document.getElementById('btn-submit');
  btn.disabled=true; btn.textContent='Invio in corso...';
  try {
    const extraFinal = [motivazione ? '💡 Motivazione: '+motivazione : '', extra].filter(Boolean).join('\n\n');
    const [p] = await sbFetch('proposals', { method:'POST', body:{ author, title, description, category, extra: extraFinal, votes:0, photos:[] } });
    // Upload photos if any
    if (selectedFiles.length > 0) {
      btn.textContent = 'Caricamento foto...';
      const photoUrls = await uploadPhotos(p.id);
      if (photoUrls.length > 0) {
        await sbFetch('proposals?id=eq.'+p.id, { method:'PATCH', body:{ photos: photoUrls }, prefer:'return=minimal' });
        p.photos = photoUrls;
      }
    }
    p.comments = [];
    proposals.unshift(p);
    ['f-name','f-title','f-motivazione','f-desc','f-cat','f-extra'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
    document.getElementById('cc').textContent='0';
    document.getElementById('photo-previews').innerHTML='';
    selectedFiles = [];
    showTab('list');
    toast('✓ Proposta inviata!');
    render();
  } catch(e) { toast('Errore: '+e.message); }
  btn.disabled=false; btn.textContent='🎭 Invia proposta';
};

// Init
loadProposals();
</script>
